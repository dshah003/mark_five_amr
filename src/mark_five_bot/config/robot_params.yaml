# Mark Five AMR - Robot Physical Parameters
# These parameters define the physical characteristics of the robot
# and are shared across multiple nodes.

# Robot geometry
robot:
  # Distance between wheel centers (meters) - RÅSKOG platform, measured
  wheel_base: 0.36

  # Wheel radius (meters) - measured circumference 234mm → r = 234/(2π) = 37.2mm
  wheel_radius: 0.0372

  # Encoder ticks per full wheel revolution — measured 2026-06-14
  ticks_per_revolution: 538

  # Measured: ticks per meter of travel
  # Left: 537.4/rev ÷ 0.234m = 2297 | Right: 538.0/rev ÷ 0.234m = 2299 | avg = 2298
  ticks_per_meter: 2298.0

# TF frame names
frames:
  odom: "odom"
  base_footprint: "base_footprint"
  base_link: "base_link"

# Serial communication settings
serial:
  port: "/dev/ttyACM0"
  baud_rate: 115200
