# Mark Five AMR - Robot Physical Parameters
# These parameters define the physical characteristics of the robot
# and are shared across multiple nodes.

# Robot geometry
robot:
  # Distance between wheel centers (meters) - RÅSKOG platform, measured
  wheel_base: 0.36

  # Wheel radius (meters) - measured circumference 234mm → r = 234/(2π) = 37.2mm
  wheel_radius: 0.0372

  # Encoder ticks per full wheel revolution (2x A-channel CHANGE decoder)
  # Left: 1075/rev | Right: 995.7/rev (right A-channel has non-50% duty cycle)
  ticks_per_revolution: 1035  # approximate average; see odometry.yaml for per-wheel values

  # Per-wheel ticks/m in odometry.yaml (left: 4594, right: 4255, avg: 4424)
  ticks_per_meter: 4424.0

# TF frame names
frames:
  odom: "odom"
  base_footprint: "base_footprint"
  base_link: "base_link"

# Serial communication settings
serial:
  port: "/dev/ttyACM0"
  baud_rate: 115200
