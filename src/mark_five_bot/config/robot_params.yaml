# Mark Five AMR - Robot Physical Parameters
# These parameters define the physical characteristics of the robot
# and are shared across multiple nodes.

# Robot geometry
robot:
  # Distance between wheel centers (meters) - RÅSKOG platform, measured
  wheel_base: 0.36

  # Wheel radius (meters) - measured circumference 230mm → r = 230/(2π) = 36.6mm
  wheel_radius: 0.0366

  # Encoder ticks per full wheel revolution
  ticks_per_revolution: 540

  # Calculated: ticks per meter of travel
  # Formula: ticks_per_revolution / circumference = 540 / 0.23 = 2348
  # Recalibrate with measured drive after any wheel change
  ticks_per_meter: 2348.0

# TF frame names
frames:
  odom: "odom"
  base_footprint: "base_footprint"
  base_link: "base_link"

# Serial communication settings
serial:
  port: "/dev/ttyACM0"
  baud_rate: 115200
