# Mark Five AMR - SLAM Toolbox Parameters
# Online async SLAM mode for real-time mapping
# Uses filtered odometry from robot_localization EKF for better accuracy

slam_toolbox:
  ros__parameters:
    # Solver plugin
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    # Map parameters
    map_file_name: ""
    map_start_at_dock: true
    map_start_pose: [0.0, 0.0, 0.0]

    # Timing and transforms
    transform_publish_period: 0.02
    map_update_interval: 3.0  # Faster updates for smoother mapping (was 5.0)
    resolution: 0.05
    max_laser_range: 4.0
    minimum_time_interval: 0.15  # Slightly more frequent scans (was 0.2)
    transform_timeout: 1.0  # Increased for distributed mode
    tf_buffer_duration: 60.0
    stack_size_to_use: 40000000
    # Increase scan queue to prevent drops in distributed mode
    scan_queue_size: 20

    # Scan matching - tuned for tracked robot with improved odometry (EKF + per-wheel calibration)
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.08  # Denser mapping (was 0.1) - tracks can scrub
    minimum_travel_heading: 0.25  # More sensitive to rotation (was 0.3) for better tracking
    scan_buffer_size: 15  # More scans for averaging (was 10)
    scan_buffer_maximum_scan_distance: 4.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 4.0  # Larger search for loop closure (was 3.0)
    do_loop_closing: true
    loop_match_minimum_chain_size: 8  # Easier loop closure (was 10) with better odometry
    loop_match_maximum_variance_coarse: 2.5  # Stricter matching (was 3.0)
    loop_match_minimum_response_coarse: 0.4  # Higher threshold (was 0.35)
    loop_match_minimum_response_fine: 0.5  # Higher threshold (was 0.45)

    # Correlation parameters - depth camera specific
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop closure parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan matcher parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
