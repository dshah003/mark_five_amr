# Mark Five AMR - SLAM Toolbox Parameters
# Online async SLAM mode for real-time mapping
# Uses filtered odometry from robot_localization EKF for better accuracy

slam_toolbox:
  ros__parameters:
    # Solver plugin
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    # Map parameters
    map_file_name: ""
    map_start_at_dock: true
    map_start_pose: [0.0, 0.0, 0.0]

    # Timing and transforms
    transform_publish_period: 0.02
    map_update_interval: 2.0
    resolution: 0.05
    max_laser_range: 12.0  # LD19 rated range (was 3.0 when /scan came from D435 depth)
    minimum_time_interval: 0.2  # Increase interval to reduce scan processing rate
    transform_timeout: 1.5  # Increased tolerance for distributed mode timing variance
    tf_buffer_duration: 60.0
    stack_size_to_use: 40000000
    # Increase scan queue to prevent drops in distributed mode
    scan_queue_size: 20

    # Scan matching - odometry heading is now gyro-backed (complementary filter
    # + EKF vyaw fusion), so odometry priors during turns are trustworthy again
    # Retuned 2026-07-04 for the 360-deg LD19 after first full-room map showed
    # rotational smear + failed loop closure (return pass drawn as new
    # geometry). Old camera-era values noted inline.
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.25  # was 0.05 — a node every 5cm flooded the
                                   # graph (600 nodes per 30m loop) and the
                                   # Nano's CPU; sparser distinct scans match
                                   # better and optimize faster
    minimum_travel_heading: 0.2   # ~11 deg - gyro heading holds between matches
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 12.0  # match max_laser_range
    link_match_minimum_response_fine: 0.45  # was 0.1 (camera-era: accept any match
                                            # to survive turns) — with 360 deg scans
                                            # weak matches are wrong matches
    link_scan_maximum_distance: 1.5  # Slightly wider search window
    loop_search_maximum_distance: 8.0  # was 3.0 — return-pass drift exceeded 3m,
                                       # so real loop candidates were never even
                                       # searched; must exceed worst-case drift
    do_loop_closing: true
    loop_match_minimum_chain_size: 10  # at 0.25m spacing = 2.5m of consistent chain
    loop_match_maximum_variance_coarse: 3.0  # was 2.0 — stock value; 2.0 rejected real closures
    loop_match_minimum_response_coarse: 0.35  # was 0.5 — camera-era over-strict
    loop_match_minimum_response_fine: 0.45  # was 0.6 — camera-era over-strict

    # Correlation parameters - depth camera specific
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop closure parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan matcher penalties. With the 360-deg LD19, rotational scan matches
    # are strong and unambiguous — let the matcher correct heading instead of
    # anchoring to the gyro prior (angle_variance_penalty 1.0 contributed to
    # the rotational smear in the first lidar map: matcher couldn't pull
    # heading back once the prior drifted).
    distance_variance_penalty: 0.3  # Encoder distance is reliable, trust it
    angle_variance_penalty: 0.5    # was 1.0 (camera-era: odometry prior had to win over weak 87-deg matches)
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
