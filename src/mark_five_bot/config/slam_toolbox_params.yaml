# Mark Five AMR - SLAM Toolbox Parameters
# Online async SLAM mode for real-time mapping
# Uses filtered odometry from robot_localization EKF for better accuracy

slam_toolbox:
  ros__parameters:
    # Solver plugin
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    # Map parameters
    map_file_name: ""
    map_start_at_dock: true
    map_start_pose: [0.0, 0.0, 0.0]

    # Timing and transforms
    transform_publish_period: 0.02
    map_update_interval: 5.0  # Slower updates reduce correction frequency (trust odometry)
    resolution: 0.05
    max_laser_range: 4.0
    minimum_time_interval: 0.2  # Increase interval to reduce scan processing rate
    transform_timeout: 1.5  # Increased tolerance for distributed mode timing variance
    tf_buffer_duration: 60.0
    stack_size_to_use: 40000000
    # Increase scan queue to prevent drops in distributed mode
    scan_queue_size: 20

    # Scan matching - tuned for EKF-fused odometry (wheel + IMU gyro)
    # With improved odometry, we trust odometry more and scan match less aggressively
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.15  # Increased - reduce correction frequency (trust odometry more)
    minimum_travel_heading: 0.35  # Increased - fewer corrections on rotation (trust gyro)
    scan_buffer_size: 10  # Reduced - less averaging needed with stable odometry
    scan_buffer_maximum_scan_distance: 4.0
    link_match_minimum_response_fine: 0.2  # Increased - require better scan match confidence
    link_scan_maximum_distance: 1.0  # Reduced - only match nearby features
    loop_search_maximum_distance: 3.0  # Reduced - conservative loop closure search
    do_loop_closing: true
    loop_match_minimum_chain_size: 10  # Require more evidence for loop closure
    loop_match_maximum_variance_coarse: 2.0  # Stricter - reduce false loop closures
    loop_match_minimum_response_coarse: 0.5  # Higher threshold - be more conservative
    loop_match_minimum_response_fine: 0.6  # Higher threshold - require strong matches

    # Correlation parameters - depth camera specific
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop closure parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan matcher parameters - trust odometry more with EKF fusion
    distance_variance_penalty: 0.3  # Lower = trust odometry position more
    angle_variance_penalty: 0.5  # Lower = trust IMU gyro angle more
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
