# Mark Five AMR - RealSense D435 Camera Parameters

# RealSense camera node parameters
camera:
  ros__parameters:
    # Camera identification
    camera_name: "camera"

    # Stream enables
    enable_color: true
    enable_depth: true
    enable_infra1: false
    enable_infra2: false
    pointcloud.enable: false  # Disabled to reduce USB bandwidth

    # Color stream settings (reduced for stability)
    rgb_camera.color_profile: "424x240x15"

    # Depth stream settings (reduced for stability)
    depth_module.depth_profile: "424x240x15"

    # Align depth to color - disabled to reduce load
    align_depth.enable: false

    # Depth filters for noise reduction
    decimation_filter.enable: true
    spatial_filter.enable: true
    temporal_filter.enable: true

# Depth to laserscan converter parameters
depthimage_to_laserscan:
  ros__parameters:
    # Output frame for laser scan
    output_frame: "camera_link"

    # Number of pixel rows to use (centered vertically)
    # Higher value = more robust but slower processing
    scan_height: 10

    # Valid depth range in meters
    # D435 effective range: 0.1m to 10m
    range_min: 0.15
    range_max: 4.0

    # Time between scans (1/15 FPS)
    scan_time: 0.0667
