# Mark Five AMR - Odometry Node Parameters

odometry_node:
  ros__parameters:
    # Robot physical parameters
    wheel_base: 0.336         # Effective wheel_base for odometry (meters) - calibrated from rotation test
                              # Physical track separation: 0.145m, but tracks scrub during rotation

    # Per-wheel calibration (accounts for wheel asymmetry)
    ticks_per_meter_left: 2686.0    # Left track calibration (from 5-test average)
    ticks_per_meter_right: 3140.0   # Right track calibration (from 5-test average)
    ticks_per_meter: 2913.0         # Fallback/average value (used if per-wheel not specified)

    # TF frame IDs
    odom_frame: "odom"
    base_frame: "base_footprint"

    # TF publishing (disabled - EKF publishes the odom->base_footprint transform)
    publish_tf: false

    # Covariance values for odometry message
    # Position covariance (diagonal values)
    pose_covariance:
      x: 0.01
      y: 0.01
      z: 1.0e6        # Not measured (2D robot)
      roll: 1.0e6     # Not measured
      pitch: 1.0e6    # Not measured
      yaw: 0.03

    # Velocity covariance (diagonal values)
    twist_covariance:
      x: 0.01
      y: 1.0e6        # Not measured (no lateral motion)
      z: 1.0e6        # Not measured
      roll: 1.0e6     # Not measured
      pitch: 1.0e6    # Not measured
      yaw: 0.03
