# Mark Five AMR - Odometry Node Parameters

odometry_node:
  ros__parameters:
    # Robot physical parameters
    wheel_base: 0.36          # Center-to-center drive wheel distance (meters) - RÅSKOG platform, measured
                              # Note: calibrate with rotation test and adjust if odometry drifts

    # Per-wheel calibration — 2x A-channel CHANGE decoder, circumference = 234mm
    # Left (inferred from 1x + 4x runs, A-channel 50% duty cycle confirmed):
    #   2 × 537.4 ticks/rev ÷ 0.234m = 4594 ticks/m
    # Right (measured 2026-06-14, avg of forward 985.2 and reverse 1006.2):
    #   995.7 ticks/rev ÷ 0.234m = 4255 ticks/m
    # 8% L/R difference is real hardware asymmetry in right encoder A-channel duty cycle
    ticks_per_meter_left: 4594.0
    ticks_per_meter_right: 4255.0
    ticks_per_meter: 4424.0         # Fallback/average value (used if per-wheel not specified)

    # TF frame IDs
    odom_frame: "odom"
    base_frame: "base_footprint"

    # TF publishing (disabled - EKF publishes the odom->base_footprint transform)
    publish_tf: false

    # Covariance values for odometry message
    # Position covariance (diagonal values)
    pose_covariance:
      x: 0.01
      y: 0.01
      z: 1.0e6        # Not measured (2D robot)
      roll: 1.0e6     # Not measured
      pitch: 1.0e6    # Not measured
      yaw: 0.03

    # Velocity covariance (diagonal values)
    twist_covariance:
      x: 0.01
      y: 1.0e6        # Not measured (no lateral motion)
      z: 1.0e6        # Not measured
      roll: 1.0e6     # Not measured
      pitch: 1.0e6    # Not measured
      yaw: 0.03
