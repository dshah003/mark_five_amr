# Mark Five AMR - RTAB-Map Parameters
# RGB-D Visual SLAM configuration for RealSense D435 + Nav2 integration

rtabmap:
  ros__parameters:
    # ===== Database and Persistence =====
    database_path: "~/.ros/rtabmap.db"
    Mem/IncrementalMemory: "true"           # Enable incremental mapping (false for localization-only)
    Mem/InitWMWithAllNodes: "false"         # Don't load all nodes on startup (faster)

    # ===== Frame IDs (must match TF tree) =====
    frame_id: "base_footprint"              # Robot base frame
    odom_frame_id: "odom"                   # Odometry frame
    map_frame_id: "map"                     # Map frame
    ground_truth_frame_id: ""               # Not used
    ground_truth_base_frame_id: ""          # Not used

    # ===== TF Management =====
    publish_tf: true                        # Publish map→odom transform
    tf_delay: 0.05                          # TF publishing delay (50ms)
    tf_tolerance: 0.1                       # TF tolerance for distributed mode
    wait_for_transform: 0.2                 # Wait time for TF lookups

    # ===== Input Topics Configuration =====
    subscribe_rgb: false                    # Not subscribing to separate RGB
    subscribe_depth: false                  # Not subscribing to separate depth
    subscribe_scan: false                   # Disable laser scan (pure visual mode)
    subscribe_scan_cloud: false             # Disable scan point cloud
    subscribe_stereo: false                 # Not using stereo
    subscribe_rgbd: true                    # Subscribe to synchronized rgbd_image from rgbd_sync

    # ===== Queue and Synchronization =====
    queue_size: 30                          # Increased for distributed mode latency
    qos: 1                                  # QoS reliability (1=reliable)
    approx_sync: true                       # CRITICAL for distributed mode (clock skew tolerance)
    approx_sync_max_interval: 0.1           # Max time difference between synced messages (100ms)

    # ===== RGB-D SLAM Core Parameters =====
    # NOTE: All RTAB-Map parameters (RGBD/*, Vis/*, Mem/*, etc.) MUST be strings
    RGBD/Enabled: "true"                    # Enable RGB-D mode
    RGBD/AngularUpdate: "0.05"              # Min angular motion to process frame (3 degrees)
    RGBD/LinearUpdate: "0.05"               # Min linear motion to process frame (5 cm)
    RGBD/OptimizeFromGraphEnd: "false"      # Optimize from loop closure point (not graph end)
    RGBD/ProximityBySpace: "true"           # Use spatial proximity for loop closure candidates
    RGBD/ProximityPathMaxNeighbors: "10"    # Max neighbors for proximity detection
    RGBD/LocalRadius: "5.0"                 # Local map radius (meters)

    # ===== Odometry Strategy =====
    Odom/Strategy: "0"                      # 0=Frame-to-Map (uses external odometry)
    Odom/ResetCountdown: "1"                # Reset after 1 lost frame
    Odom/GuessMotion: "true"                # Use EKF odometry for motion prediction
    Odom/FilteringStrategy: "0"             # No additional filtering (EKF already filtered)

    # ===== Visual Features =====
    Vis/FeatureType: "8"                    # 8=ORB (fast), 6=GFTT (accurate) - ORB recommended
    Vis/MaxFeatures: "400"                  # Features per frame (400 good balance)
    Vis/MinInliers: "15"                    # Minimum inliers for valid transform
    Vis/InlierDistance: "0.1"               # Max reprojection error for inliers (10cm)
    Vis/EstimationType: "1"                 # 0=3D-3D, 1=3D-2D (PnP) - more robust for RGBD
    Vis/MaxDepth: "4.0"                     # Max depth for features (match camera range)
    Vis/MinDepth: "0.15"                    # Min depth for features
    Vis/CorNNDR: "0.8"                      # Feature matching ratio test threshold

    # ===== Memory Management =====
    # Generous settings for high-end workstation (16GB RAM)
    Mem/STMSize: "30"                       # Short-term memory size (recent nodes)
    Mem/ImageKept: "false"                  # Don't store full images (saves RAM)
    Mem/BinDataKept: "true"                 # Keep binary features for loop closure
    Mem/RawDescriptorsKept: "true"          # Keep raw descriptors for matching
    Mem/MapLabelsAdded: "false"             # Don't add semantic labels
    Mem/UseOdomFeatures: "false"            # Don't reuse odometry features

    # Working memory management
    Mem/BadSignaturesIgnored: "true"        # Ignore signatures with low quality
    Mem/RehearsalSimilarity: "0.6"          # Similarity threshold for memory rehearsal
    Mem/NotLinkedNodesKept: "true"          # Keep nodes even if not linked
    Mem/IncrementalFlashback: "true"        # Enable flashback for loop closures

    # ===== Loop Closure Detection =====
    RGBD/LoopClosureReextractFeatures: "false"  # Don't re-extract (use stored features)
    Rtabmap/DetectionRate: "1.0"            # Loop closure detection frequency (1 Hz)
    Rtabmap/TimeThr: "0"                    # No time threshold (allow immediate loop closure)
    Rtabmap/LoopThr: "0.11"                 # Loop closure hypothesis threshold (lower=stricter)
    Rtabmap/LoopRatio: "0.0"                # Min ratio of inliers/features for loop

    # Visual loop closure parameters
    Kp/MaxFeatures: "400"                   # Max features for bag-of-words matching
    Kp/BadSignRatio: "0.5"                  # Ratio of bad/good features before rejecting

    # ===== Grid Mapping for Nav2 =====
    Grid/FromDepth: "true"                  # Generate grid from depth data
    Grid/CellSize: "0.05"                   # 5cm cell size (match Nav2 costmap)
    Grid/RangeMax: "4.0"                    # Max range for obstacles (match camera)
    Grid/RangeMin: "0.15"                   # Min range
    Grid/DepthDecimation: "4"               # Subsample depth for grid (saves CPU)
    Grid/3D: "false"                        # 2D projection for Nav2 compatibility
    Grid/RayTracing: "true"                 # Ray tracing to clear free space
    Grid/ClusterRadius: "0.1"               # Cluster obstacle cells (10cm)
    Grid/GroundIsObstacle: "false"          # Ground is not an obstacle
    Grid/MaxObstacleHeight: "0.5"           # Max obstacle height above base_footprint
    Grid/MaxGroundHeight: "0.02"            # Max ground height (2cm tolerance)
    Grid/MinGroundHeight: "-0.02"           # Min ground height
    Grid/NormalsSegmentation: "true"        # Use normal estimation for ground segmentation
    Grid/NoiseFilteringRadius: "0.05"       # Radius for noise filtering
    Grid/NoiseFilteringMinNeighbors: "5"    # Min neighbors to keep point

    # Ground plane detection
    Grid/NormalK: "20"                      # K-nearest neighbors for normal estimation
    Grid/MaxGroundAngle: "15.0"             # Max angle from horizontal for ground (degrees)

    # ===== Graph Optimization (SLAM Backend) =====
    Optimizer/Strategy: "1"                 # 0=TORO, 1=g2o, 2=GTSAM (g2o default, robust)
    Optimizer/Epsilon: "0.0001"             # Convergence epsilon
    Optimizer/Iterations: "20"              # Max iterations for optimization
    Optimizer/Robust: "true"                # Use robust kernel (Huber)
    Optimizer/VarianceIgnored: "false"      # Use covariance in optimization

    # SLAM graph management
    Rtabmap/PublishStats: "true"            # Publish SLAM statistics
    Rtabmap/PublishPdf: "false"             # Don't publish posterior
    Rtabmap/PublishLikelihood: "false"      # Don't publish likelihood
    Rtabmap/PublishRAMUsage: "true"         # Publish RAM usage for monitoring

    # ===== Distributed Mode Considerations =====
    Rtabmap/StartNewMapOnLoopClosure: "false"   # Don't start new map on loop closure
    Rtabmap/CreateIntermediateNodes: "true"     # Create nodes between key frames
    Rtabmap/MaxRetrieved: "2"                   # Max nodes retrieved from database per iteration

    # ===== Localization Mode Parameters =====
    # These are overridden when launching in localization mode
    # Mem/IncrementalMemory: "false"        # Disable mapping (localization only)
    # Mem/InitWMWithAllNodes: "true"        # Load full map on startup

    # ===== Additional Tuning =====
    RGBD/SavedLocalizationIgnored: "false"  # Use saved localization
    RGBD/MarkerDetection: "false"           # Don't use AR markers
    Stereo/Eps: "0.01"                      # Stereo epsilon (not used)

    # Bag of words (for loop closure)
    Kp/IncrementalDictionary: "true"        # Build vocabulary incrementally
    Kp/DictionaryPath: ""                   # No pre-trained vocabulary
    Kp/NNStrategy: "1"                      # 1=kd-tree (fast)

    # Logging
    Rtabmap/VerboseLogging: "false"         # Disable verbose logging (set true for debug)
